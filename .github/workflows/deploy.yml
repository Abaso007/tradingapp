name: Deploy to DigitalOcean

on:
  push:
    branches:
      - master
      - production

permissions:
  contents: read
concurrency:
  group: tradingapp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js (client build)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test server
      working-directory: server
      run: |
        npm ci
        npm audit --omit=dev --audit-level=high
        npm test -- --silent

    - name: Build React client
      run: |
        cd client
        npm ci
        npm audit --audit-level=high
        npm run build
        tar -czf ../client-build.tgz build

    - name: Copy build to droplet
      uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USERNAME }}
        key: ${{ secrets.DO_SSH_KEY }}
        port: 22
        source: client-build.tgz
        target: /tmp

    - name: Deploy to DigitalOcean
      uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USERNAME }}
        key: ${{ secrets.DO_SSH_KEY }}
        port: 22
        script: |
          set -euo pipefail
          DEPLOY_SCRIPT="$(mktemp /tmp/tradingapp-deploy.XXXXXX)"
          trap 'rm -f "$DEPLOY_SCRIPT"' EXIT
          cat > "$DEPLOY_SCRIPT" <<'DEPLOY'
          set -euo pipefail

          echo "🚀 Starting deployment..."

          # Navigate to app directory
          cd /opt/tradingapp

          # Pull latest changes
          echo "📥 Pulling latest code..."
          BRANCH="${{ github.ref_name }}"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "${{ github.sha }}"

          # Require explicit ownership before starting the hardened runtime.
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('server/config/.env', 'utf8');
          if (!/^ALPACA_OWNER_USER_ID=.+/m.test(text)) throw new Error('Configure ALPACA_OWNER_USER_ID before deployment');
          NODE

          # Ensure non-secret runtime defaults exist (keeps existing values)
          echo "⚙️ Ensuring .env defaults..."
          node server/scripts/ensure_env_defaults.js
          chmod 600 server/config/.env || true


          # Install server dependencies
          echo "📦 Installing server dependencies..."
          cd server
          npm ci --omit=dev

          # Replace client build with the artifact from GitHub Actions
          echo "📦 Updating React build..."
          cd /opt/tradingapp/client
          rm -rf build
          tar -xzf /tmp/client-build.tgz -C .
          cd ../server
          # Restart server with PM2 (starts it if missing)
          echo "🔄 Restarting application..."
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2
          pm2 startOrRestart ecosystem.config.js --only tradingapp --update-env
          pm2 save

          # Check status
          pm2 status

          # Basic health check
          echo "🏥 Checking MongoDB readiness..."
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 "http://127.0.0.1:3000/api/ready" >/dev/null; then
              echo "✅ Health check OK"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "❌ Health check failed"
              exit 1
            fi
            sleep 1
          done

          echo "✅ Deployment complete!"
          DEPLOY
          if [ "$(id -u)" -eq 0 ]; then
            chown deploy:deploy "$DEPLOY_SCRIPT"
            sudo -u deploy -H bash "$DEPLOY_SCRIPT"
          else
            test "$(id -un)" = deploy
            bash "$DEPLOY_SCRIPT"
          fi
