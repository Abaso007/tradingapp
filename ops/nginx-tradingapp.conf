# Replace TRADINGAPP_IP with the public IPv4 address after issuing its certificate.
server {
    listen 80;
    server_name TRADINGAPP_IP;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name TRADINGAPP_IP;
    ssl_certificate /etc/letsencrypt/live/TRADINGAPP_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TRADINGAPP_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/tradingapp/client/build;
    index index.html;
    location / { try_files $uri /index.html =404; }
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
